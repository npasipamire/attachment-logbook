<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attachment Logbook</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#173a2e">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('alog-theme')||'light'}catch(e){}</script>
<style>
:root{--bg:#f5f0e6;--card:#fffdf8;--fg:#1d2b24;--mut:#7a7f73;--bd:#e4dcc9;--ac:#1f6b4f;--acf:#fff;--hl:#e6f0e8;--bad:#c2410c;--am:#e0a526;--side:#173a2e;--sf:#e9efe6;--ln:#ece4d0;--sh:0 1px 0 #e4dcc9,0 10px 24px -18px rgba(30,45,35,.45);color-scheme:light}
:root[data-theme=dark]{--bg:#0f1a15;--card:#16241d;--fg:#e8efe6;--mut:#8fa196;--bd:#25382e;--ac:#5fd3a0;--acf:#08140e;--hl:#1c3328;--bad:#ff9a6b;--am:#f2c14e;--side:#0a120e;--sf:#e8efe6;--ln:#22362b;--sh:0 1px 0 #25382e;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sf);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{font:600 24px Fraunces,Georgia,serif;margin:0 10px 22px;display:flex;align-items:center;gap:9px}
.brand::before{content:"";width:14px;height:18px;border-radius:3px 6px 6px 3px;background:var(--am);box-shadow:inset 4px 0 0 rgba(0,0,0,.18)}
nav{display:flex;flex-direction:column;gap:3px}
nav button{text-align:left;border:0;background:none;padding:10px 14px;border-radius:99px;color:var(--sf);opacity:.72;font-weight:500}
nav button:hover{opacity:1;background:rgba(255,255,255,.08);border:0}
nav button.on{background:var(--am);color:#1d2b24;opacity:1;font-weight:600}
main{padding:26px 30px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
h1{font:600 32px/1.1 Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}#sub{display:block;color:var(--mut);font-size:13px;margin-top:4px}
h2{margin:0;font:600 20px Fraunces,Georgia,serif}h3{margin:0 0 12px;font:600 15px Fraunces,Georgia,serif}
button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;cursor:pointer;transition:transform .12s,border-color .12s}
button:hover{border-color:var(--ac)}button:active{transform:scale(.97)}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--acf);font-weight:500}button.del{color:var(--bad)}
input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 12px;width:100%}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:-1px}
textarea{resize:vertical;min-height:104px;line-height:26px;padding-top:2px;background:repeating-linear-gradient(transparent 0 25px,var(--ln) 25px 26px) 0 0/100% 26px local,var(--card)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.kpis .card{margin:0;border-top:5px solid var(--ac)}
.kpis .card:nth-child(2){border-top-color:var(--am)}.kpis .card:nth-child(3){border-top-color:#c2603a}.kpis .card:nth-child(4){border-top-color:#7a5ea8}
.kpi span{color:var(--mut);display:block;font-size:13px}.kpi b{font:600 36px/1.15 Fraunces,Georgia,serif}
.g2{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin:16px 0}.g2>.card{margin:0}
.two{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}
.bars{display:flex;gap:9px;align-items:flex-end;height:160px}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:11px;color:var(--mut)}
.bar i{display:block;width:100%;background:linear-gradient(180deg,var(--ac),color-mix(in srgb,var(--ac) 55%,var(--card)));border-radius:9px 9px 3px 3px;min-height:3px;margin-bottom:4px}
.bar:last-child i{background:var(--am)}
.donut{width:128px;height:128px;border-radius:50%;flex:none;-webkit-mask:radial-gradient(circle 38px,transparent 98%,#000 100%);mask:radial-gradient(circle 38px,transparent 98%,#000 100%)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.fl{flex:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.mut{color:var(--mut)}.pill{background:color-mix(in srgb,var(--am) 25%,transparent);color:var(--fg);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:500}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 8px;border-bottom:1px dashed var(--bd);vertical-align:top}
th{color:var(--mut);font-weight:500;cursor:pointer;white-space:nowrap;font-size:12px;text-transform:uppercase;letter-spacing:.05em}tr[data-open]{cursor:pointer}tr[data-open]:hover{background:var(--hl)}
.tw{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal .w{font-size:11px;color:var(--mut)}
.cal button{border-color:transparent;background:none;padding:7px 0;position:relative;border-radius:12px}
.cal .has::after{content:"";position:absolute;left:50%;bottom:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--am)}
.cal .today{border-color:var(--ac)}.cal .sel{background:var(--ac);color:var(--acf)}
.item{display:block;width:100%;text-align:left;margin-bottom:6px;border-radius:14px}.item small{display:block;color:var(--mut)}.item.sel{background:var(--hl);border-color:var(--ac)}
.list{max-height:300px;overflow:auto}
.ent{border:1px solid var(--bd);border-radius:16px;padding:12px;margin-top:12px;background:var(--bg)}.ent input[type=time]{width:122px}
.draft{background:color-mix(in srgb,var(--am) 22%,transparent);border-radius:10px;padding:6px 12px;margin-bottom:9px;font-size:13px}
label.l{display:block;margin:12px 0 4px;color:var(--mut);font-size:13px}
pre{white-space:pre-wrap;font:13px/26px Inter,system-ui,sans-serif;margin:0;border-radius:12px;padding:2px 12px;background:repeating-linear-gradient(transparent 0 25px,var(--ln) 25px 26px) 0 0/100% 26px,var(--card);border:1px solid var(--bd)}
#main>*{animation:rise .35s ease both}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@media(prefers-reduced-motion:reduce){#main>*{animation:none}}
@media(max-width:820px){.app{grid-template-columns:1fr}aside{flex-direction:row;align-items:center;overflow-x:auto;padding:10px}nav{flex-direction:row}.brand{display:none}nav button{white-space:nowrap}main{padding:16px}h1{font-size:26px}.kpis{grid-template-columns:1fr 1fr}.g2,.two{grid-template-columns:1fr}}

body{background:radial-gradient(circle,rgba(31,107,79,.08) 1px,transparent 1.6px) 0 0/22px 22px,var(--bg)}
:root[data-theme=dark] body{background:var(--bg)}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
nav button{display:flex;align-items:center;gap:11px}
aside{background:linear-gradient(180deg,#1b4a39,#12302a)}
.hero{display:flex;justify-content:space-between;align-items:center;gap:16px;background:linear-gradient(135deg,#1f6b4f,#173a2e);color:#f5f0e6;border:0}
.hero h2{font-size:26px}.hero .mut{color:#cfe0d4;margin:4px 0 0}
.hero .pri{background:var(--am);border-color:var(--am);color:#1d2b24;font-weight:600}
.ring{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--am) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;flex:none}
.ring i{width:74px;height:74px;border-radius:50%;background:#1b4636;display:grid;place-items:center;font-style:normal;text-align:center;line-height:1.1;align-content:center}
.ring small{display:block;font-size:10px;opacity:.75}
#fab{position:fixed;right:24px;bottom:24px;width:58px;height:58px;border-radius:50%;background:var(--am);border:0;color:#1d2b24;font:600 30px/1 Fraunces,Georgia,serif;box-shadow:0 10px 24px -8px rgba(0,0,0,.5);padding:0;z-index:6}
.cal .has{background:color-mix(in srgb,var(--ac) calc(var(--h,0)*38%),transparent)}.cal .sel{background:var(--ac)}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
@media(max-width:820px){.app{padding-bottom:76px}aside{position:fixed;left:0;right:0;bottom:0;z-index:5;overflow:visible;border:0;border-radius:20px 20px 0 0;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px -12px rgba(0,0,0,.5)}nav{width:100%;justify-content:space-around;gap:0}nav button{flex-direction:column;gap:2px;font-size:10.5px;padding:6px 2px;flex:1;align-items:center;border-radius:14px}#fab{right:16px;bottom:90px}.hero{flex-direction:column;align-items:flex-start}}

:root{--tc:#c9503a;--tcf:#fff;--bad:#b42318;--e1:0 1px 2px rgba(23,58,46,.07),0 10px 22px -8px rgba(23,58,46,.18),0 26px 44px -28px rgba(23,58,46,.32)}
:root[data-theme=dark]{--tc:#ff8a6b;--tcf:#2a110b;--bad:#ff8f7a;--e1:0 1px 2px rgba(0,0,0,.4),0 14px 28px -10px rgba(0,0,0,.6)}
.card{box-shadow:var(--e1);transition:transform .18s,box-shadow .18s}
.kpis .card:hover,.item:hover,tr[data-open]:hover{transform:translateY(-2px)}
aside{box-shadow:8px 0 36px -14px rgba(8,28,20,.55)}
nav button.on{box-shadow:0 8px 18px -8px rgba(224,165,38,.8)}
.hero{box-shadow:0 18px 40px -18px rgba(23,58,46,.75),0 2px 4px rgba(23,58,46,.2);position:relative;overflow:hidden}
.hero>*{position:relative;z-index:1}
.hero::before{content:"";position:absolute;right:-70px;top:-80px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(224,165,38,.38),transparent 66%)}
.hero::after{content:"";position:absolute;left:-60px;bottom:-110px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(201,80,58,.45),transparent 66%)}
.hero .pri{background:var(--tc);border-color:var(--tc);color:var(--tcf);box-shadow:0 8px 18px -8px rgba(201,80,58,.9)}
.ring{box-shadow:0 0 0 6px rgba(255,255,255,.06),0 10px 24px -8px rgba(0,0,0,.5)}
#fab{background:var(--tc);color:var(--tcf);box-shadow:0 14px 28px -10px rgba(201,80,58,.9),0 3px 6px rgba(0,0,0,.25)}
#fab:hover{transform:translateY(-2px) rotate(90deg);transition:transform .25s}
#inst{background:var(--tc);border-color:var(--tc);color:var(--tcf)}
button.pri{box-shadow:0 8px 16px -10px var(--ac)}
.kpis .card{background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--card) 90%,var(--ac)))}
.kpis .card:nth-child(3){border-top-color:#2f8f6b}.kpis .card:nth-child(4){border-top-color:var(--tc)}
.kpis .card:nth-child(4) b{color:var(--tc)}
.pill,.draft{background:color-mix(in srgb,var(--tc) 14%,transparent);color:var(--tc)}
.draft{color:var(--fg);border-left:3px solid var(--tc)}
.cal .today{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 25%,transparent)}
.cal .sel{box-shadow:0 8px 16px -8px var(--ac)}
.item.sel{box-shadow:0 8px 18px -12px var(--ac)}
.bar:last-child i{background:linear-gradient(180deg,var(--am),var(--tc))}
.ent{box-shadow:0 6px 16px -12px rgba(23,58,46,.4)}
input:focus,textarea:focus{outline-color:var(--tc)}
</style>
</head>
<body>
<div class="app">
<aside><div class="brand">Logbook</div><nav><button data-v="dash"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg><span>Home</span></button><button data-v="log"><svg viewBox="0 0 24 24"><path d="M4 4h12a3 3 0 013 3v13H7a3 3 0 01-3-3zM4 17a3 3 0 013-3h12"/></svg><span>Daily log</span></button><button data-v="all"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Entries</span></button><button data-v="wk"><svg viewBox="0 0 24 24"><path d="M4 6h16v14H4zM4 10h16M9 3v4M15 3v4"/></svg><span>Weekly</span></button><button data-v="info"><svg viewBox="0 0 24 24"><path d="M12 4a4 4 0 100 8 4 4 0 000-8zM4 21a8 8 0 0116 0"/></svg><span>Info</span></button><button data-v="sync"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg><span>Sync</span></button></nav></aside>
<main><div class="top"><div><h1 id="title"></h1><span id="sub"></span></div><div class="row"><span id="saved" class="mut"></span><button id="inst" class="pri" hidden>Install app</button><button id="th" title="Light or dark">◐</button></div></div><div id="main"></div></main><button id="fab" title="Log today">+</button>
</div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const today=iso(new Date());
const WD=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
const dmy=d=>d.split('-').reverse().join('/'),wd=d=>WD[parse(d).getDay()],fm=m=>MN[+m.slice(5)-1]+' '+m.slice(0,4);
const CATS=['Orientation','Meetings','Learning','Support calls','Documentation','DR & checklists','Development','Holiday','Other'];
const PAL=['#6d7cff','#f5a524','#22c55e','#ef5da8','#38bdf8','#a78bfa','#fb7185','#94a3b8','#14b8a6'];
const DT=[{l:'Weekly meeting',c:'Meetings',p:'Attended weekly meeting'},{l:'Support calls',c:'Support calls',p:'Handled calls from users reporting slowness'},{l:'Public holiday',s:'',e:'',c:'Holiday',p:'Public holiday'}];
const TP=()=>S.tpl||DT;
const FL=[['name','Student name'],['reg','Registration number'],['prog','Programme and year'],['uni','University'],['usup','University supervisor (name, contact)'],['org','Company / organisation'],['dept','Department'],['isup','Industrial supervisor (name, title)'],['icon','Supervisor phone / email'],['start','Start date','date'],['end','End date','date']];
const KEY='alog-v2';
let SY={};try{SY=JSON.parse(localStorage.getItem('alog-sync')||'{}')}catch(e){}
const saveSY=()=>localStorage.setItem('alog-sync',JSON.stringify(SY));

let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.days)S={v:2,it:0,days:{},so:{},info:{}};
let tm;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const sv=$('#saved');if(sv){sv.textContent='Saved ✓';clearTimeout(window._sv);window._sv=setTimeout(()=>{sv.textContent=''},1500)}if(SY.tok){clearTimeout(tm);tm=setTimeout(()=>doSync(true),4000)}}
const E=d=>S.days[d]?S.days[d].es:[];
const W=d=>(S.days[d]=S.days[d]||{t:1,es:[]}).es;
const touch=d=>{S.days[d].t=Date.now();persist()};
const mm=e=>{if(!e.s||!e.e)return 0;const a=e.s.split(':'),b=e.e.split(':'),x=(+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]);return x>0?x:0};
const dm=d=>E(d).reduce((t,e)=>t+(e.d?0:mm(e)),0);
const hrs=m=>(m/60).toFixed(1).replace(/\.0$/,'');
const has=e=>e.s||e.e||(e.p||'').trim();
const filled=d=>E(d).some(e=>!e.d&&has(e));
const isHol=d=>E(d).some(e=>e.c==='Holiday');
function wdays(){const o=[];if(!S.info.start)return o;for(let x=parse(S.info.start);iso(x)<=today;x.setDate(x.getDate()+1)){const w=x.getDay();if(w&&w<6)o.push(iso(x))}return o}
const dayNo=d=>wdays().filter(x=>x<=d&&!isHol(x)).length;
const first=p=>(p||'').split('\n')[0];

let DI=null,V='dash',cur=today,month=today.slice(0,7),q='',TB={k:'d',r:-1,m:'',q:''},TXT=[];
const VIEWS={dash:['Dashboard',vDash],log:['Daily log',vLog],all:['All entries',vAll],wk:['Weekly summary',vWk],info:['Info & sign-off',vInfo],sync:['Sync & backup',vSync]};
function go(v){V=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#title').textContent=VIEWS[v][0];$('#sub').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});VIEWS[v][1]()}
function tidy(){if(S.days[cur]){const l=S.days[cur].es,n=l.filter(has);if(n.length!==l.length){S.days[cur].es=n;touch(cur)}}}
function openDay(d){if(V==='log')tidy();cur=d;month=d.slice(0,7);go('log');if(innerWidth<820)$('#day').scrollIntoView()}

function vDash(){
  if(!S.info.start)return onboard();
  const all=Object.keys(S.days).filter(filled).sort(),tot=all.reduce((t,d)=>t+dm(d),0),wds=wdays(),miss=wds.filter(d=>!filled(d));
  const mon=new Date();mon.setDate(mon.getDate()-((mon.getDay()+6)%7));
  const wk=Object.keys(S.days).filter(d=>d>=iso(mon)&&d<=today).reduce((t,d)=>t+dm(d),0);
  const dr=Object.keys(S.days).filter(d=>E(d).some(e=>e.d)).length;
  const last=wds.slice(-10),mx=Math.max(540,...last.map(dm));
  const bars=last.map(d=>`<div class="bar"><i style="height:${Math.round(dm(d)/mx*100)}%"></i>${d.slice(8)}/${d.slice(5,7)}</div>`).join('');
  const cnt=CATS.map(c=>all.reduce((t,d)=>t+E(d).filter(e=>!e.d&&has(e)&&e.c===c).length,0)),sum=cnt.reduce((a,b)=>a+b,0);
  let acc=0;const cg=sum?cnt.map((n,i)=>{const a=acc;acc+=n/sum*100;return PAL[i]+' '+a+'% '+acc+'%'}).join(','):'var(--bd) 0 100%';
  const leg=CATS.map((c,i)=>cnt[i]?`<div><span class="dot" style="background:${PAL[i]}"></span>${c} <span class="mut">${cnt[i]}</span></div>`:'').join('');
  const rec=all.slice(-6).reverse().map(d=>`<tr data-open="${d}"><td>${wd(d).slice(0,3)} ${dmy(d)}</td><td>${hrs(dm(d))} h</td><td>${esc(E(d).filter(has)[0].c)}</td><td>${esc(first(E(d).filter(has)[0].p))}</td></tr>`).join('');
  $('#main').innerHTML=heroHtml(wds)+`<div class="kpis">${[['Total hours',hrs(tot)+' h'],['Days logged',all.filter(d=>!isHol(d)).length],['This week',hrs(wk)+' h'],['Days to fill',miss.length]].map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('')}</div>
<div class="g2"><div class="card"><h3>Hours per day (last 10 working days)</h3><div class="bars">${bars}</div></div><div class="card"><h3>Entries by category</h3><div class="row"><div class="donut" style="background:conic-gradient(${cg})"></div><div>${leg||'<span class="mut">Nothing yet</span>'}</div></div></div></div>
<div class="card"><h3>Days to fill ${dr?`<span class="pill">${dr} draft day(s) from your notes to confirm</span>`:''}</h3><div class="chips">${miss.slice(0,16).map(d=>`<button data-open="${d}">${wd(d).slice(0,3)} ${dmy(d).slice(0,5)}</button>`).join('')||'<span class="mut">All caught up.</span>'}</div>${miss.length>16?`<p class="mut">+ ${miss.length-16} more, oldest first. Use the Daily log calendar for the rest.</p>`:''}</div>
<div class="card"><h3>Recent entries</h3><div class="tw"><table><tr><th>Date</th><th>Hours</th><th>Category</th><th>First point</th></tr>${rec}</table></div></div>`;
}

function heroHtml(wds){
  const h=new Date().getHours(),nm=(S.info.name||'').split(' ')[0],t=dm(today);
  let st=0;for(let i=wds.length-1;i>=0;i--){const d=wds[i];if(isHol(d))continue;if(filled(d))st++;else if(d!==today)break}
  const n=Math.floor((parse(today)-parse(S.info.start))/6048e5)+1;let ring=`<div class="ring" style="--p:100"><i><b>${n}</b><small>week</small></i></div>`;
  if(S.info.end){const a=parse(S.info.start),b=parse(S.info.end),p=Math.max(0,Math.min(100,Math.round((new Date()-a)/(b-a)*100)));ring=`<div class="ring" style="--p:${p}"><i><b>${p}%</b><small>done</small></i></div>`}
  return `<div class="card hero"><div><h2>${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}${nm?', '+esc(nm):''}</h2><p class="mut">${wd(today)} ${dmy(today)} · ${t?hrs(t)+' h logged today':'nothing logged today yet'}${st?' · '+st+'-day streak':''}</p><div class="chips"><button class="pri" data-open="${today}">${filled(today)?'Open today':'Log today'}</button></div></div>${ring}</div>`}
function onboard(){$('#main').innerHTML=`<div class="card hero" style="display:block"><h2>Welcome to your logbook</h2><p class="mut">Set the date your attachment started. Everything stays on this device unless you turn on sync.</p><div class="row" style="margin-top:12px"><input type="date" id="obd" style="max-width:200px"><button class="pri" data-a="start">Start</button><button data-a="rs">Restore a backup or starter file</button></div><input type="file" id="fl" accept=".json" hidden></div>`}
function vLog(){
  $('#main').innerHTML=`<div class="two"><div><div class="card"><input id="q" type="search" placeholder="Search all entries…" value="${esc(q)}"></div><div class="card"><div class="row sp"><button data-nav="-1">‹</button><b id="mt"></b><button data-nav="1">›</button></div><div class="cal" id="cal" style="margin-top:8px"></div></div><div class="card"><h3 id="lt"></h3><div class="mut" id="ms" style="margin-bottom:8px"></div><div class="list" id="list"></div></div></div><section class="card" id="day"></section></div>`;
  renderCal();renderList();renderDay();
}
function renderCal(){
  $('#mt').textContent=fm(month);
  const y=+month.slice(0,4),m=+month.slice(5)-1,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate();
  let h=['M','T','W','T','F','S','S'].map(x=>`<span class="w">${x}</span>`).join('')+'<span></span>'.repeat(off);
  for(let i=1;i<=n;i++){const d=month+'-'+pad(i);h+=`<button data-open="${d}" style="--h:${Math.min(1,dm(d)/510).toFixed(2)}" class="${E(d).some(has)?'has ':''}${d===today?'today ':''}${d===cur?'sel':''}">${i}</button>`}
  $('#cal').innerHTML=h;
}
function renderList(){
  let ds,sub;
  if(q){const k=q.toLowerCase();ds=Object.keys(S.days).filter(d=>E(d).some(e=>has(e)&&((e.p||'')+' '+e.c).toLowerCase().includes(k))||dmy(d).includes(k)||wd(d).toLowerCase().includes(k)).sort().reverse();$('#lt').textContent='Search results';sub=ds.length+' day(s) match'}
  else{ds=Object.keys(S.days).filter(d=>d.startsWith(month)&&E(d).some(has)).sort();$('#lt').textContent='Dates in '+fm(month);sub=ds.filter(filled).length+' day(s) logged, '+hrs(ds.reduce((t,d)=>t+dm(d),0))+' h'}
  $('#ms').textContent=sub;
  $('#list').innerHTML=ds.map(d=>{const L=E(d).filter(has);return `<button class="item${d===cur?' sel':''}" data-open="${d}" style="border-left:4px solid ${PAL[Math.max(0,CATS.indexOf(L[0].c))]}">${wd(d).slice(0,3)} ${dmy(d)} <span class="mut">· ${hrs(dm(d))} h</span>${L.some(e=>e.d)?' <span class="pill">draft</span>':''}<small>${esc(first(L[0].p))}</small></button>`}).join('')||'<div class="empty">No entries yet.<br>Tap + to log today.</div>';
}
function renderDay(){
  const L=E(cur);
  let h=`<div class="row sp"><h2>${esc(wd(cur)+' '+dmy(cur))}${filled(cur)&&!isHol(cur)?' · Day '+dayNo(cur):''}</h2><span class="mut" id="dt">${hrs(dm(cur))} h</span></div>`;
  h+=L.map((e,i)=>`<div class="ent" data-i="${i}" style="border-left:5px solid ${PAL[Math.max(0,CATS.indexOf(e.c))]}">${e.d?`<div class="draft">Draft from your notes: fix the details, then <button data-ok="${i}">Confirm</button></div>`:''}<div class="row"><input type="time" data-f="s" value="${esc(e.s)}"><span class="mut">to</span><input type="time" data-f="e" value="${esc(e.e)}"><select data-f="c">${CATS.map(c=>`<option${c===e.c?' selected':''}>${c}</option>`).join('')}</select><span class="mut" data-h>${mm(e)?hrs(mm(e))+' h':''}</span><i class="fl"></i><button data-st="${i}" title="Save as quick-add template">☆</button><button class="del" data-del="${i}">Delete</button></div><textarea data-f="p" placeholder="One point per line">${esc(e.p)}</textarea></div>`).join('');
  h+=`<div class="chips">${TP().map((t,i)=>`<button data-t="${i}">+ ${t.l}</button>`).join('')}<button class="pri" data-t="-1">+ Time block</button></div>`;
  $('#day').innerHTML=h;
}
const refresh=()=>{renderCal();renderList();$('#dt').textContent=hrs(dm(cur))+' h'};

function rows(){const r=[];Object.keys(S.days).sort().forEach(d=>E(d).forEach(e=>{if(has(e))r.push({d,e,h:mm(e)})}));return r}
function vAll(){
  const ms=[...new Set(rows().map(r=>r.d.slice(0,7)))];
  $('#main').innerHTML=`<div class="card"><div class="row"><input id="tq" type="search" placeholder="Search…" style="max-width:260px" value="${esc(TB.q)}"><select id="tm"><option value="">All months</option>${ms.map(m=>`<option value="${m}"${m===TB.m?' selected':''}>${fm(m)}</option>`).join('')}</select><i class="fl"></i><button data-a="csv">Export CSV</button></div><div class="tw" id="tb" style="margin-top:10px"></div></div>`;drawTb();
}
function drawTb(){
  const r=rows().filter(x=>(!TB.m||x.d.startsWith(TB.m))&&(!TB.q||(x.e.p+' '+x.e.c+' '+dmy(x.d)+' '+wd(x.d)).toLowerCase().includes(TB.q.toLowerCase())));
  const key={d:x=>x.d+(x.e.s||''),h:x=>x.h,c:x=>x.e.c||''}[TB.k];
  r.sort((a,b)=>key(a)>key(b)?TB.r:key(a)<key(b)?-TB.r:0);
  $('#tb').innerHTML=`<table><tr><th data-k="d">Date</th><th>Time</th><th data-k="h">Hours</th><th data-k="c">Category</th><th>Events</th></tr>${r.map(x=>`<tr data-open="${x.d}"><td>${wd(x.d).slice(0,3)} ${dmy(x.d)}</td><td>${esc(x.e.s)}${x.e.e?'–'+esc(x.e.e):''}</td><td>${x.h?hrs(x.h):''}</td><td>${esc(x.e.c)}${x.e.d?' <span class="pill">draft</span>':''}</td><td>${esc((x.e.p||'').split('\n').filter(Boolean).join(' • '))}</td></tr>`).join('')}</table>`;
}

function weekText(m){
  const o=[];
  for(let i=0;i<5;i++){const x=parse(m);x.setDate(x.getDate()+i);const d=iso(x),L=E(d).filter(e=>!e.d&&has(e));if(!L.length)continue;
    if(isHol(d)){o.push(wd(d).toUpperCase()+' '+dmy(d)+'\n'+L.map(e=>'• '+e.p).join('\n'));continue}
    const a=L.map(e=>e.s).filter(Boolean).sort(),b=L.map(e=>e.e).filter(Boolean).sort(),t=z=>z?z.replace(':',''):'----';
    o.push(`DAY ${dayNo(d)} – ${wd(d).toUpperCase()} ${dmy(d)}\nTIME: ${t(a[0])} – ${t(b[b.length-1])}\n`+L.flatMap(e=>(e.p||'').split('\n').filter(Boolean)).map(l=>'• '+l).join('\n'))}
  return o.join('\n\n');
}
function vWk(){
  const s=parse(S.info.start||today);s.setDate(s.getDate()-((s.getDay()+6)%7));const ws=[];
  for(let x=new Date(s);iso(x)<=today;x.setDate(x.getDate()+7))ws.push(iso(x));
  TXT=ws.map(weekText);
  $('#main').innerHTML='<p class="mut">Each week is written out in the same layout as your physical logbook. Draft entries are left out until you confirm them.</p>'+ws.map((m,i)=>({m,i})).reverse().map(o=>{const e=parse(o.m);e.setDate(e.getDate()+4);let h=0;for(let k=0;k<5;k++){const x=parse(o.m);x.setDate(x.getDate()+k);h+=dm(iso(x))}
    return `<div class="card"><div class="row sp"><h3>Week ${o.i+1} <span class="mut">${dmy(o.m)} – ${dmy(iso(e))} · ${hrs(h)} h</span></h3><button data-copy="${o.i}">Copy for logbook</button></div><pre>${esc(TXT[o.i]||'Nothing logged yet.')}</pre></div>`}).join('');
}
function vInfo(){
  const ms=[];const s=parse(S.info.start||today);for(let x=new Date(s.getFullYear(),s.getMonth(),1);iso(x).slice(0,7)<=today.slice(0,7);x.setMonth(x.getMonth()+1))ms.push(iso(x).slice(0,7));
  const all=Object.keys(S.days).filter(filled),tot=all.reduce((t,d)=>t+dm(d),0);
  $('#main').innerHTML=`<div class="g2" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Attachment details</h3>${FL.map(f=>`<label class="l">${f[1]}</label><input data-k="${f[0]}" type="${f[2]||'text'}" value="${esc(S.info[f[0]])}">`).join('')}<p class="mut">${all.length} day(s) logged · ${hrs(tot)} h in total</p></div><div class="card"><h3>Monthly supervisor sign-off</h3>${ms.map(m=>`<label class="l">${fm(m)} (name, date signed, comments)</label><textarea data-so="${m}" style="min-height:60px">${esc((S.so[m]||{}).v)}</textarea>`).join('')}</div></div><div class="card"><h3>Quick-add templates</h3><p class="mut">Save any block as a template with the ☆ button in the Daily log.</p><div class="chips">${TP().map((t,i)=>`<button data-dt="${i}">${esc(t.l)} ×</button>`).join('')}</div></div>`;
}

function installInfo(){return ['Secure page (https): '+(window.isSecureContext?'yes':'NO'),'Offline engine: '+(navigator.serviceWorker&&navigator.serviceWorker.controller?'running':'not running yet (reload once)'),'Opened as an installed app: '+((matchMedia('(display-mode: standalone)').matches||navigator.standalone)?'yes':'no'),'Install button: '+(DI?'available (top right)':'not offered by this browser right now')].join('<br>')}
function vSync(){
  $('#main').innerHTML=`<div class="g2" style="grid-template-columns:1fr 1fr"><div class="card"><h3>Sync PC and phone (free, Supabase)</h3><p class="mut">Run the SQL from README.md in a free Supabase project, paste its details here, and use the same login on every device.</p><label class="l">Project URL</label><input id="sy_url" value="${esc(SY.url)}" placeholder="https://xxxx.supabase.co"><label class="l">Publishable key (starts sb_publishable_) or anon key</label><input id="sy_key" value="${esc(SY.key)}"><label class="l">Email</label><input id="sy_em" type="email" value="${esc(SY.em)}"><label class="l">Password</label><input id="sy_pw" type="password"><div class="chips"><button class="pri" data-a="in">Sign in</button><button data-a="up">Create account</button><button data-a="sync">Sync now</button><button data-a="out">Sign out</button></div><p class="mut" id="sy_st">${SY.tok?'Signed in as '+esc(SY.em):'Not signed in'}</p></div><div class="card"><h3>Backup and export</h3><div class="chips"><button data-a="bk">Download backup</button><button data-a="rs">Restore backup</button><button data-a="csv">Export CSV</button></div><input type="file" id="fl" accept=".json" hidden><p class="mut">Everything is saved on this device automatically, even offline. Download a backup each month.</p></div></div><div class="card"><h3>Install check</h3><p class="mut">${installInfo()}</p></div>`;
}
async function api(p,o={}){const r=await fetch(SY.url+p,Object.assign({},o,{headers:Object.assign({apikey:SY.key,'Content-Type':'application/json'},SY.tok&&!p.startsWith('/auth')?{Authorization:'Bearer '+SY.tok}:{},o.headers||{})}));const t=await r.text();let j=t;try{j=JSON.parse(t)}catch(e){}if(!r.ok)throw new Error(j.msg||j.message||j.error_description||t);return j}
function tok(j){SY.tok=j.access_token;SY.rt=j.refresh_token;if(j.user)SY.uid=j.user.id;SY.exp=Date.now()+(j.expires_in||3600)*1000;saveSY()}
function merge(a,b){
  const pick=(x,y)=>!y||(x&&x.t>=y.t)?x:y,o={v:2,days:{},so:{},tpl:(b.tt||0)>(a.tt||0)?b.tpl:a.tpl,tt:Math.max(a.tt||0,b.tt||0),info:(b.it||0)>(a.it||0)?b.info:a.info,it:Math.max(a.it||0,b.it||0)};
  for(const k of new Set([...Object.keys(a.days),...Object.keys(b.days||{})]))o.days[k]=pick(a.days[k],(b.days||{})[k]);
  for(const k of new Set([...Object.keys(a.so||{}),...Object.keys(b.so||{})]))o.so[k]=pick((a.so||{})[k],(b.so||{})[k]);
  return o;
}
async function doSync(quiet){
  try{
    if(SY.rt&&Date.now()>SY.exp-60000)tok(await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:SY.rt})}));
    const r=await api('/rest/v1/logbook?select=data');if(r[0]&&r[0].data)S=merge(S,r[0].data);
    localStorage.setItem(KEY,JSON.stringify(S));
    await api('/rest/v1/logbook',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:SY.uid,data:S})});
    if(!quiet&&V!=='sync')go(V);
  }catch(e){if(!quiet)throw e}
}
function dl(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}
const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
async function act(a){
  const st=m=>{const x=$('#sy_st');if(x)x.textContent=m};
  try{
    if(a==='start'){const v=$('#obd').value;if(!v)return;S.info.start=v;S.it=Date.now();persist();return go('dash')}
    if(a==='csv'){const r=[['Date','Day','Start','Stop','Hours','Category','Events','Draft']];rows().forEach(x=>r.push([dmy(x.d),wd(x.d),x.e.s,x.e.e,hrs(x.h),x.e.c,(x.e.p||'').split('\n').filter(Boolean).join(' | '),x.e.d?'yes':'']));return dl('attachment-logbook.csv',r.map(l=>l.map(cell).join(',')).join('\n'),'text/csv')}
    if(a==='bk')return dl('logbook-backup-'+today+'.json',JSON.stringify(S,null,1),'application/json');
    if(a==='rs')return $('#fl').click();
    if(a==='out'){SY.tok=SY.rt='';saveSY();return st('Signed out')}
    SY.url=$('#sy_url').value.trim().replace(/\/$/,'');SY.key=$('#sy_key').value.trim();SY.em=$('#sy_em').value.trim();saveSY();
    if(a==='in'||a==='up'){const j=await api(a==='up'?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:SY.em,password:$('#sy_pw').value})});if(!j.access_token)return st('Account created. Confirm the email Supabase sent, then sign in.');tok(j)}
    st('Syncing…');await doSync();st('Synced at '+new Date().toLocaleTimeString());
  }catch(e){st('Error: '+e.message)}
}

document.addEventListener('click',e=>{
  const c=a=>e.target.closest('['+a+']');let n;
  if(n=c('data-v'))return go(n.dataset.v);
  if(n=c('data-open'))return openDay(n.dataset.open);
  if(n=c('data-nav')){const d=new Date(+month.slice(0,4),+month.slice(5)-1+ +n.dataset.nav,1);month=iso(d).slice(0,7);renderCal();return}
  if(n=c('data-t')){const i=+n.dataset.t,t=i<0?{}:TP()[i],L=W(cur),p=L[L.length-1];L.push({s:t.s!==undefined?t.s:(p?p.e||'':'08:00'),e:t.e!==undefined?t.e:(p?'':'16:30'),c:t.c||'Other',p:t.p||''});touch(cur);renderDay();refresh();return}
  if(n=c('data-st')){const e=E(cur)[+n.dataset.st],l=prompt('Name this quick-add template');if(l){S.tpl=TP().concat([{l,s:e.s,e:e.e,c:e.c,p:e.p}]);S.tt=Date.now();persist();renderDay()}return}
  if(n=c('data-dt')){S.tpl=TP().filter((_,j)=>j!==+n.dataset.dt);S.tt=Date.now();persist();vInfo();return}
  if(n=c('data-ok')){W(cur)[+n.dataset.ok].d=0;touch(cur);renderDay();refresh();return}
  if(n=c('data-del')){if(confirm('Delete this time block?')){W(cur).splice(+n.dataset.del,1);touch(cur);renderDay();refresh()}return}
  if(n=c('data-copy')){const i=+n.dataset.copy;navigator.clipboard.writeText(TXT[i]||'').then(()=>{n.textContent='Copied'})}
  if(n=c('data-a'))return act(n.dataset.a);
  if(e.target.tagName==='TH'&&e.target.dataset.k){const k=e.target.dataset.k;TB.r=TB.k===k?-TB.r:1;TB.k=k;drawTb()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='fl'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.days)throw 0;if(confirm('Replace the current logbook with this backup?')){S=j;persist();go('dash')}}catch(x){alert('That is not a valid backup file.')}};r.readAsText(f);return}
  if(t.id==='tm'){TB.m=t.value;drawTb();return}
  if(t.closest('#day')&&t.dataset.f){const box=t.closest('.ent'),en=W(cur)[+box.dataset.i];en[t.dataset.f]=t.value;touch(cur);box.querySelector('[data-h]').textContent=mm(en)?hrs(mm(en))+' h':'';refresh()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='q'){q=t.value.trim();renderList()}
  else if(t.id==='tq'){TB.q=t.value.trim();drawTb()}
  else if(t.closest('#day')&&t.dataset.f==='p'){W(cur)[+t.closest('.ent').dataset.i].p=t.value;touch(cur)}
  else if(t.dataset.k){S.info[t.dataset.k]=t.value;S.it=Date.now();persist()}
  else if(t.dataset.so){S.so[t.dataset.so]={t:Date.now(),v:t.value};persist()}
});
$('#th').onclick=()=>{const d=document.documentElement,n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('alog-theme',n)}catch(e){}};
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DI=e;$('#inst').hidden=false});window.addEventListener('appinstalled',()=>{$('#inst').hidden=true});$('#inst').onclick=()=>{if(DI){DI.prompt();DI=null;$('#inst').hidden=true}};
$('#fab').onclick=()=>{openDay(today);if(!E(today).length)document.querySelector('[data-t="-1"]').click()};
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
go('dash');
</script>
</body>
